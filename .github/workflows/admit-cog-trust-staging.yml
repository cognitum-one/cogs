name: Admit Cog Trust Registry to Staging

# ADR-156 source-only appender. This workflow accepts only an already
# 2-of-3-root-signed package merged through protected review. It cannot access
# a root signing key, update a WIF provider, change a runtime digest pin, seed
# Firestore, read/list the trust bucket, overwrite an object, or retry an
# ambiguous create. All environment values remain unset until separately
# approved live custody and federation evidence exists.

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: 'Tracked trust-admissions/<id> package'
        required: true
      purpose:
        description: 'Single purpose appended by this registry'
        required: true
        type: choice
        options:
          - release
          - withdrawal
      key_id:
        description: 'Exact reviewed logical authority key ID'
        required: true
      public_key_fingerprint:
        description: 'Exact reviewed sha256 SPKI fingerprint'
        required: true
      admitted_workflow_id:
        description: 'Exact numeric GitHub workflow ID'
        required: true
      admitted_workflow_sha:
        description: 'Exact reviewed 40-character publisher workflow SHA'
        required: true
      workflow_sha_approval_digest:
        description: 'Digest of the out-of-band workflow-SHA approval receipt'
        required: true

permissions:
  contents: read

concurrency:
  group: cogs-trust-admission-staging
  cancel-in-progress: false

jobs:
  append:
    name: Verify quorum and append one registry generation
    runs-on: ubuntu-latest
    environment: cogs-trust-admission-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify signed source package and protected pins
        env:
          CHANGE_ID: ${{ inputs.change_id }}
          PURPOSE: ${{ inputs.purpose }}
          KEY_ID: ${{ inputs.key_id }}
          PUBLIC_KEY_FINGERPRINT: ${{ inputs.public_key_fingerprint }}
          ADMITTED_WORKFLOW_ID: ${{ inputs.admitted_workflow_id }}
          ADMITTED_WORKFLOW_SHA: ${{ inputs.admitted_workflow_sha }}
          WORKFLOW_SHA_APPROVAL_DIGEST: ${{ inputs.workflow_sha_approval_digest }}
          WIF_PROVIDER: ${{ vars.GCP_COGS_TRUST_STAGING_WIF_PROVIDER }}
          APPEND_SA: ${{ vars.GCP_COGS_TRUST_STAGING_APPEND_SA }}
          TRUST_BUCKET: ${{ vars.GCP_COGS_TRUST_STAGING_BUCKET }}
          APPROVED_ADMISSION_WORKFLOW_SHA: ${{ vars.GCP_COGS_TRUST_STAGING_APPROVED_WORKFLOW_SHA }}
          ADMISSION_WORKFLOW_ID: ${{ vars.GCP_COGS_TRUST_STAGING_WORKFLOW_ID }}
          BOOTSTRAP_DIGEST: ${{ vars.GCP_COGS_STAGING_TRUST_BOOTSTRAP_DIGEST }}
          APPROVED_REGISTRY_DIGEST: ${{ vars.GCP_COGS_TRUST_STAGING_APPROVED_REGISTRY_DIGEST }}
          HEAD_SEQUENCE: ${{ vars.GCP_COGS_TRUST_STAGING_REGISTRY_HEAD_SEQUENCE }}
          HEAD_DIGEST: ${{ vars.GCP_COGS_TRUST_STAGING_REGISTRY_HEAD_DIGEST }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          mkdir -p out/trust-admission
          CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/cog_trust_admission.py \
            --change-id "$CHANGE_ID" \
            --expected-bootstrap-digest "$BOOTSTRAP_DIGEST" \
            --expected-registry-digest "$APPROVED_REGISTRY_DIGEST" \
            --expected-head-sequence "$HEAD_SEQUENCE" \
            --expected-head-digest "$HEAD_DIGEST" \
            --purpose "$PURPOSE" \
            --key-id "$KEY_ID" \
            --public-key-fingerprint "$PUBLIC_KEY_FINGERPRINT" \
            --admitted-workflow-id "$ADMITTED_WORKFLOW_ID" \
            --admitted-workflow-sha "$ADMITTED_WORKFLOW_SHA" \
            --workflow-sha-approval-digest "$WORKFLOW_SHA_APPROVAL_DIGEST" \
            --admission-wif-provider "$WIF_PROVIDER" \
            --admission-service-account "$APPEND_SA" \
            --trust-bucket "$TRUST_BUCKET" \
            --github-owner-id "$REPOSITORY_OWNER_ID" \
            --github-repository-id "$REPOSITORY_ID" \
            --repository-visibility "$REPOSITORY_VISIBILITY" \
            --admission-workflow-id "$ADMISSION_WORKFLOW_ID" \
            --admission-workflow-ref "$WORKFLOW_REF" \
            --admission-workflow-sha "$WORKFLOW_SHA" \
            --approved-admission-workflow-sha "$APPROVED_ADMISSION_WORKFLOW_SHA" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --event-name "$EVENT_NAME" \
            --actor-id "$ACTOR_ID" \
            --checked-at "$CHECKED_AT" \
            --output out/trust-admission/verified-plan.json

      - name: Authenticate the create-only appender
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_COGS_TRUST_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_COGS_TRUST_STAGING_APPEND_SA }}

      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Append the exact immutable registry object
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SOURCE=$(jq -er '.registry.path' out/trust-admission/verified-plan.json)
          DESTINATION=$(jq -er '.registry.destination' out/trust-admission/verified-plan.json)
          CONTENT_DIGEST=$(jq -er '.registry.fileDigest' out/trust-admission/verified-plan.json)
          PAYLOAD_DIGEST=$(jq -er '.registry.payloadDigest' out/trust-admission/verified-plan.json)
          PLAN_DIGEST="sha256:$(sha256sum out/trust-admission/verified-plan.json | awk '{print $1}')"

          set +e
          CREATED_LOG=$(timeout --signal=TERM --kill-after=5s 120s \
            gcloud storage cp \
            --if-generation-match=0 \
            --print-created-message \
            "$SOURCE" "$DESTINATION" 2>&1)
          CREATE_STATUS=$?
          set -e

          VERSIONED_URI=""
          if [ "$CREATE_STATUS" -eq 0 ]; then
            set +e
            VERSIONED_URI=$(CREATED_LOG="$CREATED_LOG" DESTINATION="$DESTINATION" \
              python3 - <<'PY'
          import os
          import re

          destination = os.environ["DESTINATION"]
          matches = {
              candidate
              for candidate in re.findall(
                  r"gs://[^\s]+#[1-9][0-9]*", os.environ["CREATED_LOG"]
              )
              if candidate.rsplit("#", 1)[0] == destination
          }
          if len(matches) != 1:
              raise SystemExit("create did not return one exact positive generation")
          print(matches.pop())
          PY
            )
            PARSE_STATUS=$?
            set -e
            if [ "$PARSE_STATUS" -ne 0 ]; then
              CREATE_STATUS=76
            fi
          fi
          TRANSPORT_DIGEST="sha256:$(printf '%s' "$CREATED_LOG" | sha256sum | awk '{print $1}')"

          if [ "$CREATE_STATUS" -ne 0 ]; then
            CREATE_STATUS="$CREATE_STATUS" \
              CONTENT_DIGEST="$CONTENT_DIGEST" \
              PAYLOAD_DIGEST="$PAYLOAD_DIGEST" \
              PLAN_DIGEST="$PLAN_DIGEST" \
              TRANSPORT_DIGEST="$TRANSPORT_DIGEST" \
              DESTINATION="$DESTINATION" \
              RUN_ID="$RUN_ID" \
              RUN_ATTEMPT="$RUN_ATTEMPT" \
              python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path("out/trust-admission/verified-plan.json").read_text()
          )
          receipt = {
              "schema": "cognitum.cog.trust-append-attempt.v1",
              "status": "UNKNOWN",
              "retryAllowed": False,
              "observedAt": datetime.datetime.now(datetime.timezone.utc)
              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "changeId": plan["changeId"],
              "sourceSha": plan["sourceSha"],
              "workflow": plan["admissionWorkflow"],
              "runId": os.environ["RUN_ID"],
              "runAttempt": os.environ["RUN_ATTEMPT"],
              "destination": os.environ["DESTINATION"],
              "contentDigest": os.environ["CONTENT_DIGEST"],
              "registryPayloadDigest": os.environ["PAYLOAD_DIGEST"],
              "verifiedPlanDigest": os.environ["PLAN_DIGEST"],
              "transportOutputDigest": os.environ["TRANSPORT_DIGEST"],
              "exitCode": int(os.environ["CREATE_STATUS"]),
              "receiptAttestation": "PENDING_EXTERNAL",
              "reconcileWith": "PENDING_READ_ONLY_TRUST_OBJECT_AUDITOR",
          }
          Path("out/trust-admission/create-result-unknown.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
            echo "::error::trust-registry create is UNKNOWN; never retry, overwrite, or use an alternate path"
            exit 75
          fi

          VERSIONED_URI="$VERSIONED_URI" \
            CONTENT_DIGEST="$CONTENT_DIGEST" \
            PAYLOAD_DIGEST="$PAYLOAD_DIGEST" \
            PLAN_DIGEST="$PLAN_DIGEST" \
            TRANSPORT_DIGEST="$TRANSPORT_DIGEST" \
            RUN_ID="$RUN_ID" \
            RUN_ATTEMPT="$RUN_ATTEMPT" \
            python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path("out/trust-admission/verified-plan.json").read_text()
          )
          receipt = {
              "schema": "cognitum.cog.trust-append-attempt.v1",
              "status": "COMMITTED",
              "retryAllowed": False,
              "observedAt": datetime.datetime.now(datetime.timezone.utc)
              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "changeId": plan["changeId"],
              "sourceSha": plan["sourceSha"],
              "workflow": plan["admissionWorkflow"],
              "runId": os.environ["RUN_ID"],
              "runAttempt": os.environ["RUN_ATTEMPT"],
              "versionedUri": os.environ["VERSIONED_URI"],
              "contentDigest": os.environ["CONTENT_DIGEST"],
              "registryPayloadDigest": os.environ["PAYLOAD_DIGEST"],
              "verifiedPlanDigest": os.environ["PLAN_DIGEST"],
              "transportOutputDigest": os.environ["TRANSPORT_DIGEST"],
              "receiptAttestation": "PENDING_EXTERNAL",
              "deploymentAuthority": False,
          }
          Path("out/trust-admission/create-result-committed.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
          echo "No provider, runtime pin, Firestore projection, or production state was changed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve append candidate for independent readback and attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-trust-append-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/trust-admission/verified-plan.json
            out/trust-admission/create-result-committed.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve ambiguous append receipt for read-only reconciliation
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-trust-append-unknown-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/trust-admission/verified-plan.json
            out/trust-admission/create-result-unknown.json
          if-no-files-found: ignore
          retention-days: 30
