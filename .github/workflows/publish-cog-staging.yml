name: Publish Cog to Staging

# Isolated E2E lane for ADR-153. This workflow has no push/tag trigger and the
# cogs-staging environment must require the dedicated staging WIF identity.
# The provider must pin repository_id=1211713542, owner_id=256911919,
# workflow_id=322710413, workflow_ref and workflow_sha for this exact file,
# workflow_dispatch, cogs-staging, and refs/heads/main.
# Changing the approved workflow SHA is a separate two-owner environment
# operation governed by ADR-156; a repository commit cannot approve itself.

on:
  workflow_dispatch:
    inputs:
      cog:
        description: 'Cog id (directory under src/cogs/)'
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  matrix:
    name: Resolve staging build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate cog and resolve arches
        id: gen
        env:
          COG_INPUT: ${{ inputs.cog }}
        run: |
          set -euo pipefail
          COG="$COG_INPUT"
          if [[ ! "$COG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::invalid cog id"
            exit 1
          fi
          if [ ! -f "src/cogs/$COG/cog.toml" ]; then
            echo "::error::no such cog: src/cogs/$COG/cog.toml does not exist"
            exit 1
          fi
          test -f "src/cogs/$COG/release-policy.json" \
            || { echo "::error::no ratified release-policy.json for $COG"; exit 1; }
          test -f "src/cogs/$COG/Cargo.lock" \
            || { echo "::error::no committed per-Cog Cargo.lock for $COG"; exit 1; }
          python3 scripts/cog_integrations_cli.py validate "src/cogs/$COG/cog.toml"
          MATRIX=$(python3 scripts/cog-targets.py --matrix "$COG")
          echo "include=$(echo "$MATRIX" | jq -c '.include')" >> "$GITHUB_OUTPUT"
          CARGO_VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('src/cogs/$COG/Cargo.toml','rb'))['package']['version'])")
          MANIFEST_VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('src/cogs/$COG/cog.toml','rb'))['cog']['version'])")
          if [ "$CARGO_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::version disagreement: Cargo.toml=$CARGO_VERSION cog.toml=$MANIFEST_VERSION"
            echo "::error::reconcile both manifests before a signed staging release"
            exit 1
          fi
          VERSION="$CARGO_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::invalid semantic version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-staging:
    name: Staging ${{ matrix.cog }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ubuntu-latest
    environment: cogs-staging
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.triple }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Cross-compile cog-${{ matrix.cog }} (${{ matrix.arch }})
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target ${{ matrix.triple }}
          BIN="target/${{ matrix.triple }}/release/cog-${{ matrix.cog }}"
          ${{ matrix.strip }} "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN" "$GITHUB_WORKSPACE/out/cog-${{ matrix.cog }}-${{ matrix.gcs }}"
          file "$BIN"

      - name: Stage deliberate cog-specific assets
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          SUFFIX: ${{ matrix.suffix }}
          GCS: ${{ matrix.gcs }}
          COG_VERSION: ${{ needs.matrix.outputs.version }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euo pipefail
          EXTRA="src/cogs/${{ matrix.cog }}/publish-extra.sh"
          if [ -f "$EXTRA" ]; then
            bash "$EXTRA"
          fi

      - name: Emit content-addressed integration manifest
        id: integrations
        env:
          COG_ID: ${{ matrix.cog }}
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/cog_integrations_cli.py emit \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --out-dir out/integrations)
          export RESULT
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          result = json.loads(os.environ["RESULT"])
          root = Path("out/integrations").resolve()
          manifest = Path(result["manifestPath"]).resolve()
          checksum = Path(result["checksumPath"]).resolve()
          expected = {manifest, checksum}
          actual = set(root.iterdir()) if root.is_dir() else set()
          if actual != expected or any(path.is_symlink() or not path.is_file() for path in expected):
              raise SystemExit("integration emitter must resolve exactly one manifest and one checksum")
          measured = hashlib.sha256(manifest.read_bytes()).hexdigest()
          if result["digest"] != f"sha256:{measured}":
              raise SystemExit("integration emitter digest does not match exact manifest bytes")
          expected_name = (
              f"cog-{os.environ['COG_ID']}-integrations-v1-sha256-{measured}.json"
          )
          if manifest.name != expected_name:
              raise SystemExit("integration manifest filename is not exactly content-addressed")
          if checksum.name != f"{expected_name}.sha256":
              raise SystemExit("integration checksum filename is not exact")
          if checksum.read_text(encoding="utf-8") != f"{measured}  {expected_name}\n":
              raise SystemExit("integration checksum does not bind the exact manifest")
          workspace = Path.cwd().resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"manifest={manifest.relative_to(workspace).as_posix()}", file=output)
              print(f"checksum={checksum.relative_to(workspace).as_posix()}", file=output)
              print(f"digest=sha256:{measured}", file=output)
          PY

      - name: Inspect locked website profile
        id: website
        run: |
          set -euo pipefail
          PROFILE=$(python3 scripts/cog_website_bundle.py inspect \
            "src/cogs/${{ matrix.cog }}/cog.toml")
          echo "enabled=$(echo "$PROFILE" | jq -r '.enabled')" >> "$GITHUB_OUTPUT"
          echo "kind=$(echo "$PROFILE" | jq -r '.kind')" >> "$GITHUB_OUTPUT"

      - name: Require locked website build inputs
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        run: |
          set -euo pipefail
          test -f "src/cogs/${{ matrix.cog }}/package.json"
          test -f "src/cogs/${{ matrix.cog }}/package-lock.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/cogs/${{ matrix.cog }}/package-lock.json

      - name: Run vite-production-v1
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/vite
          node_modules/.bin/vite build

      - name: Package deterministic website bundle
        id: website_bundle
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        env:
          COG_ID: ${{ matrix.cog }}
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/cog_website_bundle.py package \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --cog-dir "src/cogs/${{ matrix.cog }}" \
            --out-dir out/website)
          export RESULT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          result = json.loads(os.environ["RESULT"])
          root = Path("out/website").resolve()
          bundle = Path(result["bundlePath"]).resolve()
          checksum = Path(result["checksumPath"]).resolve()
          expected = {bundle, checksum}
          actual = set(root.iterdir()) if root.is_dir() else set()
          if actual != expected or any(path.is_symlink() or not path.is_file() for path in expected):
              raise SystemExit("website packager must resolve exactly one bundle and one checksum")
          measured = hashlib.sha256(bundle.read_bytes()).hexdigest()
          if result["digest"] != f"sha256:{measured}":
              raise SystemExit("website bundle digest does not match exact bytes")
          expected_name = f"cog-{os.environ['COG_ID']}-website-v1-sha256-{measured}.tar.gz"
          if bundle.name != expected_name or checksum.name != f"{expected_name}.sha256":
              raise SystemExit("website bundle/checksum filename is not exactly content-addressed")
          if checksum.read_text(encoding="utf-8") != f"{measured}  {expected_name}\n":
              raise SystemExit("website checksum does not bind the exact bundle")
          workspace = Path.cwd().resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"bundle={bundle.relative_to(workspace).as_posix()}", file=output)
              print(f"checksum={checksum.relative_to(workspace).as_posix()}", file=output)
              print(f"digest=sha256:{measured}", file=output)
          PY

      - name: Pin one release build timestamp
        run: echo "COG_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Vulnerability scan and pinned SBOM
        env:
          CARGO_AUDIT_VERSION: '0.22.2'
          SYFT_VERSION: '1.44.0'
          SYFT_SHA256: '0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a'
        run: |
          set -euo pipefail
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --quiet
          set +e
          (cd "src/cogs/${{ matrix.cog }}" && cargo audit --json) > out/vuln-scan.json
          AUDIT_STATUS=$?
          set -e
          export AUDIT_STATUS
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("out/vuln-scan.json"))
          advisories = data.get("vulnerabilities", {}).get("list") or []
          for row in advisories:
              advisory = row.get("advisory", {})
              print(f"::error::{advisory.get('id')}: {advisory.get('title')}")
          if advisories or int(os.environ["AUDIT_STATUS"]) != 0:
              raise SystemExit("vulnerability scan did not produce a passing verdict")
          PY
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "$SYFT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" scan "dir:src/cogs/${{ matrix.cog }}" \
            -o cyclonedx-json=out/sbom.cdx.json -q
          test -s out/sbom.cdx.json

      - name: Preserve and verify Sigstore keyless artifact evidence
        env:
          BIN: out/cog-${{ matrix.cog }}-${{ matrix.gcs }}
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/cosign"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$BIN.sigstore.json" "$BIN"
          "$RUNNER_TEMP/cosign" verify-blob --bundle "$BIN.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$BIN"

      - name: Enforce declared console isolation
        run: |
          set -euo pipefail
          (cd "src/cogs/${{ matrix.cog }}" && cargo build --locked --release)
          python3 scripts/cog_isolation.py \
            --cog-id "${{ matrix.cog }}" \
            --manifest "src/cogs/${{ matrix.cog }}/cog.toml" \
            --binary "src/cogs/${{ matrix.cog }}/target/release/cog-${{ matrix.cog }}" \
            --output out/isolation-runs.json

      - name: SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e
        with:
          subject-path: out/cog-${{ matrix.cog }}-${{ matrix.gcs }}

      - name: Preserve provenance bundle
        run: |
          set -euo pipefail
          test -s "${{ steps.provenance.outputs.bundle-path }}"
          cp "${{ steps.provenance.outputs.bundle-path }}" out/provenance.sigstore.json

      - name: Require stage-only WIF and KMS configuration
        id: kms
        env:
          WIF_PROVIDER: ${{ vars.GCP_COGS_STAGING_WIF_PROVIDER }}
          PUBLISH_SA: ${{ vars.GCP_COGS_STAGING_PUBLISH_SA }}
          KEY_RESOURCE: ${{ vars.GCP_COGS_STAGING_SIGNING_KEY_RESOURCE }}
          KEY_ID: ${{ vars.GCP_COGS_STAGING_SIGNING_KEY_ID }}
          EVIDENCE_BUCKET: ${{ vars.GCP_COGS_STAGING_EVIDENCE_BUCKET }}
          EVIDENCE_RETENTION_SECONDS: ${{ vars.GCP_COGS_STAGING_EVIDENCE_RETENTION_SECONDS }}
          EVIDENCE_RETENTION_LOCKED: ${{ vars.GCP_COGS_STAGING_EVIDENCE_RETENTION_LOCKED }}
          APPROVED_WORKFLOW_SHA: ${{ vars.GCP_COGS_STAGING_APPROVED_WORKFLOW_SHA }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
          EXPECTED_WORKFLOW_ID: '322710413'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          provider, service = os.environ["WIF_PROVIDER"], os.environ["PUBLISH_SA"]
          expected_provider = (
              "projects/186366152200/locations/global/workloadIdentityPools/"
              "github-cog-authority-stg/providers/cogs-release-publisher-stg"
          )
          if provider != expected_provider:
              raise SystemExit("staging WIF provider is not the dedicated cogs publisher")
          expected_service = (
              "cog-release-publisher-stg@cognitum-20260110."
              "iam.gserviceaccount.com"
          )
          if service != expected_service:
              raise SystemExit("staging publisher service account is not dedicated")
          parts = os.environ["KEY_RESOURCE"].split("/")
          labels = ["projects", "locations", "keyRings", "cryptoKeys", "cryptoKeyVersions"]
          if len(parts) != 10 or parts[::2] != labels:
              raise SystemExit("invalid or missing staging KMS key-version resource")
          if any(not re.fullmatch(r"[A-Za-z0-9_.-]{1,128}", value) for value in parts[1::2]):
              raise SystemExit("invalid KMS resource segment")
          if not parts[-1].isdigit():
              raise SystemExit("KMS key version must be numeric")
          expected_key = (
              "projects/cognitum-20260110/locations/us-central1/keyRings/"
              "cog-release-stg/cryptoKeys/release-ed25519/cryptoKeyVersions/1"
          )
          if os.environ["KEY_RESOURCE"] != expected_key:
              raise SystemExit("staging signer is not the reviewed key version")
          key_id = os.environ["KEY_ID"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}", key_id):
              raise SystemExit("invalid or missing logical staging signing key id")
          bucket = os.environ["EVIDENCE_BUCKET"]
          if bucket != "cognitum-20260110-cog-release-stg":
              raise SystemExit("staging release evidence bucket is not dedicated")
          try:
              retention = int(os.environ["EVIDENCE_RETENTION_SECONDS"])
          except ValueError as error:
              raise SystemExit("invalid staging evidence retention period") from error
          if retention != 30 * 24 * 60 * 60:
              raise SystemExit("staging evidence retention must be exactly 30 days")
          if os.environ["EVIDENCE_RETENTION_LOCKED"] != "false":
              raise SystemExit("Proposed ADR-156 does not authorize retention lock")
          expected_identity = {
              "REPOSITORY_OWNER_ID": "256911919",
              "REPOSITORY_ID": "1211713542",
              "EXPECTED_WORKFLOW_ID": "322710413",
              "REPOSITORY_VISIBILITY": "public",
              "WORKFLOW_REF": (
                  "cognitum-one/cogs/.github/workflows/"
                  "publish-cog-staging.yml@refs/heads/main"
              ),
              "RELEASE_REF": "refs/heads/main",
              "RELEASE_EVENT": "workflow_dispatch",
          }
          for name, expected in expected_identity.items():
              if os.environ[name] != expected:
                  raise SystemExit(f"GitHub release identity mismatch: {name}")
          if (
              not re.fullmatch(r"[a-f0-9]{40}", os.environ["WORKFLOW_SHA"])
              or os.environ["WORKFLOW_SHA"] != os.environ["RELEASE_SHA"]
          ):
              raise SystemExit("workflow SHA is not the exact reviewed release SHA")
          if (
              not re.fullmatch(r"[a-f0-9]{40}", os.environ["APPROVED_WORKFLOW_SHA"])
              or os.environ["APPROVED_WORKFLOW_SHA"] != os.environ["WORKFLOW_SHA"]
          ):
              raise SystemExit("workflow SHA lacks separate environment approval")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in zip(("project", "location", "keyring", "key", "version"), parts[1::2]):
                  print(f"{name}={value}", file=output)
              print(f"key_id={key_id}", file=output)
              print(f"evidence_bucket={bucket}", file=output)
              print(f"evidence_retention_seconds={retention}", file=output)
              print("evidence_retention_locked=false", file=output)
          PY

      - name: Build the exact unsigned website release statement
        run: |
          set -euo pipefail
          PREPARE=(
            python3 scripts/cog_release_provenance.py prepare
            --policy "src/cogs/${{ matrix.cog }}/release-policy.json"
            --arch "${{ matrix.arch }}"
            --version "${{ needs.matrix.outputs.version }}"
            --source-commit "${{ github.sha }}"
            --artifact "out/cog-${{ matrix.cog }}-${{ matrix.gcs }}"
            --integration-manifest "${{ steps.integrations.outputs.manifest }}"
            --sigstore-bundle "out/cog-${{ matrix.cog }}-${{ matrix.gcs }}.sigstore.json"
            --dependency-lock "src/cogs/${{ matrix.cog }}/Cargo.lock"
            --sbom out/sbom.cdx.json
            --vulnerability-scan out/vuln-scan.json
            --provenance out/provenance.sigstore.json
            --isolation out/isolation-runs.json
            --key-id "${{ steps.kms.outputs.key_id }}"
            --builder-identity "github-actions://cognitum-one/cogs"
            --build-workflow "cognitum-one/cogs/.github/workflows/publish-cog-staging.yml@refs/heads/main"
            --built-at "$COG_BUILT_AT"
            --repository "${{ github.repository }}"
            --sigstore-tool-version "cosign@v3.1.2"
            --output-dir out/release
          )
          if [ "${{ steps.website.outputs.kind }}" = "static-build" ]; then
            PREPARE+=(--static-website-bundle "${{ steps.website_bundle.outputs.bundle }}")
          fi
          "${PREPARE[@]}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_COGS_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_COGS_STAGING_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Sign raw canonical release bytes with KMS Ed25519
        run: |
          set -euo pipefail
          KMS_ARGS=(
            --project "${{ steps.kms.outputs.project }}"
            --location "${{ steps.kms.outputs.location }}"
            --keyring "${{ steps.kms.outputs.keyring }}"
            --key "${{ steps.kms.outputs.key }}"
          )
          ALGORITHM=$(gcloud kms keys versions describe "${{ steps.kms.outputs.version }}" \
            "${KMS_ARGS[@]}" --format='value(algorithm)')
          STATE=$(gcloud kms keys versions describe "${{ steps.kms.outputs.version }}" \
            "${KMS_ARGS[@]}" --format='value(state)')
          PROTECTION=$(gcloud kms keys versions describe "${{ steps.kms.outputs.version }}" \
            "${KMS_ARGS[@]}" --format='value(protectionLevel)')
          [ "$ALGORITHM" = "EC_SIGN_ED25519" ] \
            || { echo "::error::KMS version is not EC_SIGN_ED25519"; exit 1; }
          [ "$STATE" = "ENABLED" ] \
            || { echo "::error::KMS signing version is not enabled"; exit 1; }
          [ "$PROTECTION" = "SOFTWARE" ] \
            || { echo "::error::KMS signing version is not SOFTWARE"; exit 1; }
          gcloud kms keys versions get-public-key "${{ steps.kms.outputs.version }}" \
            "${KMS_ARGS[@]}" --public-key-format=pem \
            --output-file=out/release/release-public-key.pem
          # EC_SIGN_ED25519 is PureEdDSA: send raw canonical bytes, never a digest flag.
          gcloud kms asymmetric-sign \
            "${KMS_ARGS[@]}" --version "${{ steps.kms.outputs.version }}" \
            --input-file=out/release/release-statement.json \
            --signature-file=out/release/release-signature.b64

      - name: Finalize candidate release and verify its detached signature
        run: |
          set -euo pipefail
          REGISTRY_ISSUED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export REGISTRY_ISSUED_AT
          read -r REGISTRY_EXPIRES_AT KEY_EXPIRES_AT < <(python3 - <<'PY'
          import datetime
          import os

          issued = datetime.datetime.fromisoformat(
              os.environ["REGISTRY_ISSUED_AT"].replace("Z", "+00:00")
          )
          print(
              (issued + datetime.timedelta(days=90)).strftime("%Y-%m-%dT%H:%M:%SZ"),
              (issued + datetime.timedelta(days=365)).strftime("%Y-%m-%dT%H:%M:%SZ"),
          )
          PY
          )
          python3 scripts/cog_release_provenance.py registry \
            --public-key out/release/release-public-key.pem \
            --key-id "${{ steps.kms.outputs.key_id }}" \
            --kms-key-version "${{ vars.GCP_COGS_STAGING_SIGNING_KEY_RESOURCE }}" \
            --kms-algorithm EC_SIGN_ED25519 \
            --protection-level SOFTWARE \
            --purpose release \
            --builder-identity "github-actions://cognitum-one/cogs" \
            --build-workflow "cognitum-one/cogs/.github/workflows/publish-cog-staging.yml@refs/heads/main" \
            --workflow-sha "${{ github.sha }}" \
            --sequence 1 \
            --issued-at "$REGISTRY_ISSUED_AT" \
            --not-before "$REGISTRY_ISSUED_AT" \
            --expires-at "$REGISTRY_EXPIRES_AT" \
            --key-not-before "$REGISTRY_ISSUED_AT" \
            --key-expires-at "$KEY_EXPIRES_AT" \
            --github-owner-id "${{ github.repository_owner_id }}" \
            --github-repository-id "${{ github.repository_id }}" \
            --github-workflow-id 322710413 \
            --output out/release/candidate-trust-registry.json
          jq -e '.schema == "cognitum.cog.trust-registry.v3" and (.signatures | not)' \
            out/release/candidate-trust-registry.json >/dev/null
          python3 scripts/cog_release_provenance.py finalize \
            --unsigned-release out/release/unsigned-release.json \
            --build-evidence out/release/build-evidence.json \
            --signature-file out/release/release-signature.b64 \
            --output out/release/release-evidence.json \
            --signed-release-output out/release/signed-release.json
          python3 scripts/cog_release_provenance.py verify \
            --release out/release/signed-release.json \
            --registry out/release/candidate-trust-registry.json
          echo "This registry is a candidate only; offline root quorum admission is still required."

      - name: Issue bounded signed release validity
        run: |
          set -euo pipefail
          VALIDITY_ISSUED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export VALIDITY_ISSUED_AT
          VALIDITY_EXPIRES_AT=$(python3 - <<'PY'
          import datetime
          import os

          issued = datetime.datetime.fromisoformat(
              os.environ["VALIDITY_ISSUED_AT"].replace("Z", "+00:00")
          )
          print(
              (issued + datetime.timedelta(days=30))
              .astimezone(datetime.timezone.utc)
              .strftime("%Y-%m-%dT%H:%M:%SZ")
          )
          PY
          )
          python3 scripts/cog_release_provenance.py prepare-release-validity \
            --release out/release/signed-release.json \
            --registry out/release/candidate-trust-registry.json \
            --issued-at "$VALIDITY_ISSUED_AT" \
            --signed-at "$VALIDITY_ISSUED_AT" \
            --not-before "$VALIDITY_ISSUED_AT" \
            --expires-at "$VALIDITY_EXPIRES_AT" \
            --output-dir out/release
          KMS_ARGS=(
            --project "${{ steps.kms.outputs.project }}"
            --location "${{ steps.kms.outputs.location }}"
            --keyring "${{ steps.kms.outputs.keyring }}"
            --key "${{ steps.kms.outputs.key }}"
          )
          gcloud kms asymmetric-sign \
            "${KMS_ARGS[@]}" --version "${{ steps.kms.outputs.version }}" \
            --input-file=out/release/release-validity-statement.json \
            --signature-file=out/release/release-validity-signature.b64
          python3 scripts/cog_release_provenance.py finalize-release-validity \
            --release out/release/signed-release.json \
            --registry out/release/candidate-trust-registry.json \
            --unsigned-validity out/release/unsigned-release-validity.json \
            --signature-file out/release/release-validity-signature.b64 \
            --output out/release/signed-release-validity.json

      - name: Upload immutable staging release objects
        env:
          EVIDENCE_BUCKET: ${{ steps.kms.outputs.evidence_bucket }}
          EVIDENCE_RETENTION_SECONDS: ${{ steps.kms.outputs.evidence_retention_seconds }}
          EVIDENCE_RETENTION_LOCKED: ${{ steps.kms.outputs.evidence_retention_locked }}
        run: |
          set -euo pipefail
          ROOT="gs://${EVIDENCE_BUCKET}/staging/cogs/releases/${{ matrix.cog }}/${{ needs.matrix.outputs.version }}/${{ matrix.arch }}"
          RELEASE_EVIDENCE_URI=""
          RELEASE_EVIDENCE_GENERATION=""
          RELEASE_EVIDENCE_DIGEST=""
          upload_immutable() {
            local source="$1"
            local category="$2"
            local digest destination created_log versioned_uri status
            digest=$(sha256sum "$source" | awk '{print $1}')
            destination="$ROOT/$category/sha256/$digest/$(basename "$source")"
            set +e
            created_log=$(timeout --signal=TERM --kill-after=5s 120s \
              gcloud storage cp \
              --if-generation-match=0 \
              --print-created-message \
              "$source" "$destination" 2>&1)
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              CREATE_DESTINATION="$destination" CREATE_DIGEST="sha256:$digest" \
                CREATE_EXIT="$status" python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "cognitum.cog.create-reconciliation.v1",
              "status": "UNKNOWN",
              "destination": os.environ["CREATE_DESTINATION"],
              "contentDigest": os.environ["CREATE_DIGEST"],
              "observedAt": datetime.datetime.now(datetime.timezone.utc)
              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "exitCode": int(os.environ["CREATE_EXIT"]),
              "retryAllowed": False,
              "reconcileWith": (
                  "cognitum-one/website/.github/workflows/"
                  "reconcile-cog-seed-staging.yml"
              ),
          }
          target = Path("out/release/create-result-unknown.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
              echo "::error::create result is UNKNOWN; do not retry or upsert; use the read-only auditor"
              return 75
            fi
            printf '%s\n' "$created_log"
            versioned_uri=$(CREATED_LOG="$created_log" DESTINATION="$destination" \
              python3 - <<'PY'
          import os, re

          destination = os.environ["DESTINATION"]
          matches = {
              candidate
              for candidate in re.findall(
                  r"gs://[^\s]+#[1-9][0-9]*", os.environ["CREATED_LOG"]
              )
              if candidate.rsplit("#", 1)[0] == destination
          }
          if len(matches) != 1:
              raise SystemExit("upload did not return one exact immutable generation")
          print(matches.pop())
          PY
            )
            echo "| \`${source#out/}\` | \`$versioned_uri\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$source" = "out/release/release-evidence.json" ]; then
              RELEASE_EVIDENCE_URI="${versioned_uri%#*}"
              RELEASE_EVIDENCE_GENERATION="${versioned_uri##*#}"
              RELEASE_EVIDENCE_DIGEST="sha256:$digest"
            fi
          }
          {
            echo "### Staging: ${{ matrix.cog }} ${{ needs.matrix.outputs.version }} ${{ matrix.arch }}"
            echo ""
            echo "| immutable object | GCS URI |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          upload_immutable "out/cog-${{ matrix.cog }}-${{ matrix.gcs }}" "binary"
          upload_immutable "${{ steps.integrations.outputs.manifest }}" "integrations"
          upload_immutable "${{ steps.integrations.outputs.checksum }}" "integrations"
          if [ "${{ steps.website.outputs.kind }}" = "static-build" ]; then
            upload_immutable "${{ steps.website_bundle.outputs.bundle }}" "website"
            upload_immutable "${{ steps.website_bundle.outputs.checksum }}" "website"
          fi
          if [ -d out/extra ]; then
            while IFS= read -r -d '' asset; do
              upload_immutable "$asset" "assets"
            done < <(find out/extra -type f -print0 | sort -z)
          fi
          for evidence in \
            out/vuln-scan.json \
            out/sbom.cdx.json \
            out/isolation-runs.json \
            out/provenance.sigstore.json \
            "out/cog-${{ matrix.cog }}-${{ matrix.gcs }}.sigstore.json" \
            out/release/policy-decision.json \
            out/release/release-statement-metadata.json \
            out/release/release-evidence.json \
            out/release/signed-release.json \
            out/release/release-validity-statement-metadata.json \
            out/release/signed-release-validity.json \
            out/release/candidate-trust-registry.json; do
            upload_immutable "$evidence" "evidence"
          done
          test -n "$RELEASE_EVIDENCE_URI"
          test -n "$RELEASE_EVIDENCE_GENERATION"
          test -n "$RELEASE_EVIDENCE_DIGEST"
          python3 scripts/cog_release_provenance.py admission \
            --bucket-name "$EVIDENCE_BUCKET" \
            --retention-period-seconds "$EVIDENCE_RETENTION_SECONDS" \
            --retention-policy-locked "$EVIDENCE_RETENTION_LOCKED" \
            --kind release \
            --uri "$RELEASE_EVIDENCE_URI" \
            --generation "$RELEASE_EVIDENCE_GENERATION" \
            --content-digest "$RELEASE_EVIDENCE_DIGEST" \
            --sigstore-bundle-digest "$(sha256sum "out/cog-${{ matrix.cog }}-${{ matrix.gcs }}.sigstore.json" | awk '{print "sha256:"$1}')" \
            --sigstore-transparency-log-verified true \
            --output out/release/candidate-release-evidence-locations.json
          upload_immutable \
            out/release/candidate-release-evidence-locations.json \
            admission
          echo "Dedicated protected-bucket admission candidate emitted; root quorum remains required."
          echo "No production or legacy mutable path was written."

      - name: Preserve evidence admission candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-release-admission-candidate-${{ matrix.cog }}-${{ matrix.arch }}-${{ github.sha }}
          path: out/release/candidate-release-evidence-locations.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve ambiguous create receipt for read-only reconciliation
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-release-create-unknown-${{ matrix.cog }}-${{ matrix.arch }}-${{ github.sha }}
          path: out/release/create-result-unknown.json
          if-no-files-found: ignore
          retention-days: 7
