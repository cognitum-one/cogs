name: Publish Cog

# Per-cog manual-dispatch publish: cross-compiles ONE cog for every arch its
# cog.toml `hardware_requirement` declares (armhf for pi-zero-2w, aarch64 for
# v0-appliance — see scripts/cog-targets.py), uploads the stripped binary to
# gs://cognitum-apps/cogs/{arm,arm64}/, and prints the sha256s for the
# app-registry.json bump.
#
# This repo OWNS cog source + build + publish. The install catalog
# (app-registry.json) lives in cognitum-one/seed — update it by hand from the
# sha256 table in this run's summary (minimal topology, no cross-repo token).
# See docs/adrs/ADR-018-tailscale-cog.md / ADR-101-cog-publish-pipeline.md.
#
# Secret required: GCP_COGNITUM_APPS_SA (SA JSON with objectAdmin on
# gs://cognitum-apps).

on:
  workflow_dispatch:
    inputs:
      cog:
        description: 'Cog id (directory under src/cogs/, e.g. tailscale)'
        required: true
      cog_version:
        description: 'Cog version override (blank = cog.toml [cog].version)'
        required: false
        default: ''

permissions:
  contents: read
  # Keyless signing: the workflow's own OIDC identity is the signer. No private key is
  # stored, generated or held anywhere — Fulcio issues a short-lived certificate bound to
  # this repository and workflow, and Rekor records the signature in a public transparency
  # log. That is what makes the signature verifiable by anyone without trusting us.
  id-token: write
  # SLSA build provenance is written to GitHub's attestation store by the provenance step.
  attestations: write

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate cog + resolve arches
        id: gen
        run: |
          set -euo pipefail
          COG='${{ inputs.cog }}'
          if [ ! -f "src/cogs/$COG/cog.toml" ]; then
            echo "::error::no such cog: src/cogs/$COG/cog.toml does not exist"
            exit 1
          fi
          MATRIX=$(python3 scripts/cog-targets.py --matrix "$COG")
          echo "include=$(echo "$MATRIX" | jq -c '.include')" >> "$GITHUB_OUTPUT"

          # VERSION DISAGREEMENT IS AN ERROR, NOT A PREFERENCE.
          #
          # This step read cog.toml's version and published under it. Cargo.toml's version is
          # the one COMPILED INTO THE BINARY (CARGO_PKG_VERSION) and reported by --version, and
          # the two disagree for 85 of 109 cogs — anomaly-detect says 1.0.0 in cog.toml and
          # 1.2.0 in Cargo.toml.
          #
          # That produced a signed release record stating a version the artifact does not have.
          # The signature is still valid over the bytes, which is exactly what makes it
          # dangerous: it cryptographically attests a document containing a false claim about
          # the thing it attests to. A stale version in provenance is worse than no version,
          # because a consumer has no way to tell it is stale.
          #
          # So: refuse. There is no safe automatic choice here — picking Cargo.toml would
          # silently republish 85 cogs under new numbers, and picking cog.toml is the bug.
          # Someone has to say which is right. `cog_version` remains available as the explicit
          # override for the case where a human HAS decided.
          CARGO_V=$(python3 -c "import tomllib;print(tomllib.load(open('src/cogs/$COG/Cargo.toml','rb'))['package']['version'])")
          COGTOML_V=$(python3 -c "import tomllib;print(tomllib.load(open('src/cogs/$COG/cog.toml','rb'))['cog']['version'])")
          V='${{ inputs.cog_version }}'
          if [ -z "$V" ]; then
            if [ "$CARGO_V" != "$COGTOML_V" ]; then
              echo "::error::version disagreement for $COG — cog.toml says $COGTOML_V, Cargo.toml says $CARGO_V."
              echo "::error::Cargo.toml's value is what the binary reports. Refusing to sign provenance stating a version the artifact does not have."
              echo "::error::Reconcile the two files, or re-run with the cog_version input to state the intended version explicitly."
              exit 1
            fi
            V="$COGTOML_V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version sources: cog.toml=$COGTOML_V Cargo.toml=$CARGO_V -> publishing $V"
          echo "Publishing $COG v$V for: $(echo "$MATRIX" | jq -r '.include[].arch' | tr '\n' ' ')"

  publish:
    name: ${{ matrix.cog }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Cross-compile cog-${{ matrix.cog }} (${{ matrix.arch }})
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          # --locked: build from the committed Cargo.lock or FAIL. Without it cargo resolves
          # dependencies fresh on every run, so two builds of one commit can differ and no
          # signature over the output means anything — reproducibility precedes provenance.
          cargo build --locked --release --target ${{ matrix.triple }}
          BIN="target/${{ matrix.triple }}/release/cog-${{ matrix.cog }}"
          ${{ matrix.strip }} "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN" "$GITHUB_WORKSPACE/out/cog-${{ matrix.cog }}-${{ matrix.suffix }}"
          file "$BIN"

      - name: Stage cog-specific extra assets (optional publish-extra.sh)
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          SUFFIX: ${{ matrix.suffix }}
          GCS: ${{ matrix.gcs }}
          COG_VERSION: ${{ needs.matrix.outputs.version }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euo pipefail
          EXTRA="src/cogs/${{ matrix.cog }}/publish-extra.sh"
          if [ -f "$EXTRA" ]; then
            echo "Running $EXTRA for arch=$ARCH"
            bash "$EXTRA"
          else
            echo "no publish-extra.sh for ${{ matrix.cog }} — binary-only cog"
          fi

      - name: Compute sha256s
        id: sha
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.cog }} — ${{ matrix.arch }} (v${{ needs.matrix.outputs.version }})"
            echo ""
            echo "| asset | sha256 | bytes |"
            echo "|---|---|---|"
            for f in out/*; do
              [ -f "$f" ] || continue
              s=$(sha256sum "$f" | awk '{print $1}')
              b=$(stat -c%s "$f")
              echo "| \`$(basename "$f")\` | \`$s\` | $b |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Release evidence (ADR-113 §1, gates A3-A7) ──────────────────────────
      # Each step below produces a DIGEST that goes into the release record. A release
      # missing any of them is refused by verify-cog-releases.mjs in cognitum-one/website,
      # and that refusal is the gate working rather than a bug to route around.

      - name: Dependency lock digest (gate A3 — reproducibility)
        id: lock
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "::error::no Cargo.lock — build is not reproducible"; exit 1; }
          echo "digest=sha256:$(sha256sum Cargo.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Vulnerability scan (gate A5)
        id: vuln
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --quiet 2>/dev/null || cargo install cargo-audit --quiet
          # `|| true` on the SCAN, never on the digest: a advisory-DB hit must be recorded and
          # reviewed, not silently pass, but a scan that finds nothing must still emit evidence.
          cargo audit --json > "$GITHUB_WORKSPACE/out/vuln-scan.json" || true
          test -s "$GITHUB_WORKSPACE/out/vuln-scan.json"
          echo "digest=sha256:$(sha256sum "$GITHUB_WORKSPACE/out/vuln-scan.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          # THE VERDICT IS READ FROM THE SCAN, NOT ASSUMED.
          #
          # The policy-decision record hardcoded `"verdict": "pass"` for A5. Combined with the
          # `|| true` above — which is correct, a scan that finds something must still emit its
          # evidence — that meant a cog with real advisories would have been published with a
          # SIGNED document asserting its vulnerability scan passed. The digest recorded the
          # findings faithfully while the verdict beside it contradicted them, and a verdict
          # that cannot say "fail" is not a verdict.
          #
          # Advisories fail the publish. Warnings (unmaintained, yanked) are reported and do
          # not, because they are not vulnerabilities and failing on them would train people
          # to route around this gate — which is how a security gate stops being believed.
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          d = json.load(open(os.environ['GITHUB_WORKSPACE'] + '/out/vuln-scan.json'))
          adv = d.get('vulnerabilities', {}).get('list') or []
          warn = {k: len(v) for k, v in (d.get('warnings') or {}).items() if v}
          print(f'advisories={len(adv)}')
          print(f'verdict={"fail" if adv else "pass"}')
          sys.stderr.write(f'advisories: {len(adv)}   warnings: {warn or "none"}\n')
          for a in adv:
              i = a.get('advisory', {})
              sys.stderr.write(f"::error::{i.get('id')} in {i.get('package')}: {i.get('title')}\n")
          if adv:
              sys.stderr.write('::error::refusing to publish — see the advisories above. '
                               'The scan evidence is still written; fix or vendor-patch the dependency.\n')
              sys.exit(1)
          EOF

      - name: SBOM (gate A4)
        id: sbom
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" >/dev/null
          "$RUNNER_TEMP/bin/syft" scan "dir:src/cogs/${{ matrix.cog }}" \
            -o cyclonedx-json="$GITHUB_WORKSPACE/out/sbom.cdx.json" -q
          test -s "$GITHUB_WORKSPACE/out/sbom.cdx.json"
          echo "digest=sha256:$(sha256sum "$GITHUB_WORKSPACE/out/sbom.cdx.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Sign the binary — cosign keyless (gate A7)
        id: sign
        env:
          BIN: out/cog-${{ matrix.cog }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          # PINNED, not `releases/latest`. A floating tool version broke this step the first
          # time it ran for real (cosign v3 removed --output-signature in favour of --bundle),
          # but the deeper problem is that a pipeline whose whole claim is REPRODUCIBLE builds
          # cannot fetch a signing tool that changes underneath it. The checksum is verified
          # because pinning a version you do not check is only a naming convention.
          COSIGN_VERSION=v3.1.2
          COSIGN_SHA256=f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/cosign"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c - \
            || { echo "::error::cosign checksum mismatch — refusing to sign with an unverified tool"; exit 1; }
          chmod +x "$RUNNER_TEMP/cosign"

          # --yes accepts the transparency-log entry. cosign v3 writes a single Sigstore bundle
          # carrying the signature, the Fulcio certificate and the Rekor inclusion proof.
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$BIN.sigstore.json" "$BIN"

          # VERIFY WHAT WE JUST SIGNED, and bind it to THIS workflow. A sign step that never
          # verifies proves only that cosign exited 0 — it does not establish that the bundle
          # validates, nor that the identity in the certificate is the one we expect. Pinning
          # the identity to this repo+workflow is the part that makes the signature mean
          # "cognitum-one/cogs built this" rather than merely "somebody signed something".
          "$RUNNER_TEMP/cosign" verify-blob --bundle "$BIN.sigstore.json" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$BIN" \
            || { echo "::error::the signature we just produced does not verify"; exit 1; }

          echo "binary=sha256:$(sha256sum "$BIN" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "signature=sha256:$(sha256sum "$BIN.sigstore.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "cosignVersion=${COSIGN_VERSION}" >> "$GITHUB_OUTPUT"

      # ── Isolation (gate A6) ─────────────────────────────────────────────────
      # Runs the cog under the limits its OWN cog.toml declares, and records what held. This
      # is the gate that had never been satisfiable: all 109 cogs declared allowed_commands,
      # max_runtime_secs and output_limit_bytes, and nothing enforced any of it (see #60), so
      # there was nothing to gather evidence about.
      #
      # EXPECT THIS TO FAIL FOR MOST COGS TODAY, and that is the gate working. 107 cogs list
      # `--help` in allowed_commands and exactly ONE implements it (#62); the rest ignore the
      # flag, fall through to their normal run loop, and get killed at their own deadline. A
      # cog that hangs on a command it advertises is not releasable, so the step refuses. Fix
      # the cog — do not relax this check to route around it.
      #
      # HOST-ARCH build, deliberately. The published artifact is cross-compiled for armhf or
      # aarch64 and cannot execute on the runner, so the isolation run uses a native build of
      # the SAME source at the SAME commit. That is a real limitation and it is recorded in the
      # evidence as `runOnTarget: false` rather than glossed: this proves the limits bind for
      # this code, not that they bind on the device.
      - name: Isolation evidence — enforce the declared [console] limits
        id: isolation
        env:
          COG: ${{ matrix.cog }}
        run: |
          set -euo pipefail
          # Built from its own directory, NOT `-p cog-runner`: the repo root is a [package],
          # not a [workspace], so a package spec matches nothing. Verified — `-p` errors with
          # "did not match any packages".
          ( cd crates/cog-runner && cargo build --locked --release )
          export RUNNER="$GITHUB_WORKSPACE/crates/cog-runner/target/release/cog-runner"

          # Native build of the cog under test — the cross-compiled artifact cannot run here.
          ( cd "src/cogs/$COG" && cargo build --locked --release )
          export NATIVE="src/cogs/$COG/target/release/cog-$COG"

          # Every allowed_command is exercised. A policy is only shown to bind if the thing it
          # permits actually runs and the thing it forbids actually does not.
          python3 - > "$GITHUB_WORKSPACE/out/isolation-runs.json" <<'PYEOF'
          import json, subprocess, tomllib, os, sys
          cog = os.environ['COG']; runner = os.environ['RUNNER']; native = os.environ['NATIVE']
          policy = tomllib.load(open(f'src/cogs/{cog}/cog.toml','rb'))['console']
          runs = []
          for cmd in policy['allowed_commands']:
              p = subprocess.run([runner,'--cog-toml',f'src/cogs/{cog}/cog.toml','--binary',native,
                                  '--command',cmd,'--cog-id',cog], capture_output=True, text=True)
              runs.append({'command': cmd, 'exit': p.returncode,
                           'evidence': json.loads(p.stdout) if p.stdout.strip().startswith('{') else None})
          # NEGATIVE CONTROL. A run where everything is permitted proves nothing about a gate;
          # the refusal is what shows the allowlist binds at all.
          denied = subprocess.run([runner,'--cog-toml',f'src/cogs/{cog}/cog.toml','--binary',native,
                                   '--command','--definitely-not-allowed','--cog-id',cog],
                                  capture_output=True, text=True)
          runs.append({'command':'--definitely-not-allowed','exit':denied.returncode,
                       'refused': denied.returncode == 4, 'evidence': None})
          json.dump({'cogId': cog, 'runOnTarget': False, 'policy': policy, 'runs': runs}, sys.stdout, indent=2)
          PYEOF

          # A file that exists is not evidence. The control must have REFUSED, and every
          # permitted command must have held its limits, or this is not isolation evidence.
          python3 - <<'PYEOF'
          import json, sys, os
          d = json.load(open(os.environ['GITHUB_WORKSPACE'] + '/out/isolation-runs.json'))
          control = [r for r in d['runs'] if r['command'] == '--definitely-not-allowed']
          if not control or not control[0].get('refused'):
              print('::error::allowlist did not refuse a disallowed command — not isolation evidence')
              sys.exit(1)
          for r in d['runs']:
              ev = r.get('evidence')
              if ev and not (ev['within_runtime_limit'] and ev['within_output_limit']):
                  print(f"::error::{r['command']} breached its declared limits")
                  sys.exit(1)
          print('isolation: every allowed command held its limits; the control was refused')
          PYEOF
          echo "digest=sha256:$(sha256sum "$GITHUB_WORKSPACE/out/isolation-runs.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "passed=true" >> "$GITHUB_OUTPUT"

      # ── Provenance (gate A2) ────────────────────────────────────────────────
      # SLSA build provenance, signed by the same keyless OIDC identity. The signature says
      # these bytes were signed by this workflow; provenance says HOW they were produced —
      # which source, which builder, which inputs. A release can be validly signed and still
      # have come from an unknown build, so ADR-113 §1 requires both.
      #
      # Produced by GitHub's own attestor rather than hand-rolled: the predicate is generated
      # from the runner's authenticated view of the build, not from values this step could
      # simply assert about itself.
      - name: SLSA build provenance (gate A2)
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/cog-${{ matrix.cog }}-${{ matrix.suffix }}

      - name: Provenance digest
        id: prov
        run: |
          set -euo pipefail
          BUNDLE='${{ steps.provenance.outputs.bundle-path }}'
          test -s "$BUNDLE" || { echo "::error::attestor produced no provenance bundle"; exit 1; }
          cp "$BUNDLE" "$GITHUB_WORKSPACE/out/provenance.sigstore.json"
          echo "digest=sha256:$(sha256sum "$GITHUB_WORKSPACE/out/provenance.sigstore.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # ── Policy decision (gate A8) ───────────────────────────────────────────
      # The registry requires a policyDecisionDigest: a record of WHICH controls were evaluated
      # and what each returned, bound to this artifact. Without it "all gates passed" is an
      # assertion with nothing behind it, and a reviewer cannot tell a gate that passed from a
      # gate that never ran — the failure mode that had `isolationPassed` hardcoded to false
      # for months while looking like a considered verdict.
      #
      # Every value here is read from a prior step's OUTPUT. A step that failed never sets one,
      # and a failed step fails the job, so this record cannot describe a gate that did not run.
      - name: Policy decision record (gate A8)
        id: policy
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/out/policy-decision.json" <<EOF
          {
            "subject": "${{ steps.sign.outputs.binary }}",
            "evaluatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "policyVersion": "adr-113-rev-15-gates-a1-a8",
            "controls": [
              { "id": "A3", "name": "dependency-lock",   "verdict": "pass", "evidence": "${{ steps.lock.outputs.digest }}" },
              { "id": "A4", "name": "sbom",              "verdict": "pass", "evidence": "${{ steps.sbom.outputs.digest }}" },
              { "id": "A5", "name": "vulnerability-scan","verdict": "${{ steps.vuln.outputs.verdict }}", "advisories": ${{ steps.vuln.outputs.advisories }}, "evidence": "${{ steps.vuln.outputs.digest }}" },
              { "id": "A6", "name": "isolation",         "verdict": "pass", "evidence": "${{ steps.isolation.outputs.digest }}" },
              { "id": "A7", "name": "signature",         "verdict": "pass", "evidence": "${{ steps.sign.outputs.signature }}" },
              { "id": "A2", "name": "provenance",        "verdict": "pass", "evidence": "${{ steps.prov.outputs.digest }}" }
            ]
          }
          EOF
          # A control with an empty evidence digest means its step did not run or produced
          # nothing. Recording "pass" beside a blank digest would be the exact fabrication the
          # registry exists to prevent, so refuse rather than emit it.
          python3 - <<'PYEOF'
          import json, os, sys
          d = json.load(open(os.environ['GITHUB_WORKSPACE'] + '/out/policy-decision.json'))
          bad = [c['id'] for c in d['controls'] if not c['evidence'].startswith('sha256:')]
          if bad:
              print(f"::error::controls {bad} claim pass with no evidence digest")
              sys.exit(1)
          print(f"policy: {len(d['controls'])} controls, all with evidence")
          PYEOF
          echo "digest=sha256:$(sha256sum "$GITHUB_WORKSPACE/out/policy-decision.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Emit machine-readable release evidence
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/out/release-evidence.json" <<EOF
          {
            "cogId": "${{ matrix.cog }}",
            "version": "${{ needs.matrix.outputs.version }}",
            "arch": "${{ matrix.arch }}",
            "sourceCommit": "${{ github.sha }}",
            "runtimeContractVersion": "cognitum.cog.v1",
            "artifactDigest": "${{ steps.sign.outputs.binary }}",
            "signatureDigest": "${{ steps.sign.outputs.signature }}",
            "dependencyLockDigest": "${{ steps.lock.outputs.digest }}",
            "sbomDigest": "${{ steps.sbom.outputs.digest }}",
            "vulnerabilityScanDigest": "${{ steps.vuln.outputs.digest }}",
            "signatureAlgorithm": "ecdsa-p256",
            "signatureFormat": "sigstore-bundle",
            "signingToolVersion": "cosign@${{ steps.sign.outputs.cosignVersion }}",
            "signatureVerified": true,
            "signingIdentity": "keyless:github-oidc:${{ github.repository }}",
            "builderIdentity": "github-actions://${{ github.repository }}",
            "buildWorkflow": "${{ github.workflow_ref }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "provenanceDigest": "${{ steps.prov.outputs.digest }}",
            "policyDecisionDigest": "${{ steps.policy.outputs.digest }}",
            "isolationEvidenceDigest": "${{ steps.isolation.outputs.digest }}",
            "isolationPassed": ${{ steps.isolation.outputs.passed }}
          }
          EOF
          echo "--- release evidence ---"; cat "$GITHUB_WORKSPACE/out/release-evidence.json"
          # `signatureVerified: true` is not a constant either, for the same reason. The sign
          # step runs `cosign verify-blob` against the bundle it just produced and exits
          # non-zero if it does not validate or the certificate identity is not this workflow.
          # A failed step fails the job, so this file is only ever written after a verification
          # that actually passed — the field cannot be reached any other way.
          #
          # isolationPassed now comes from an actual enforced run (the step above), not from a
          # constant. The step exits non-zero unless the allowlist REFUSED a disallowed command
          # and every permitted command held its runtime and output limits — so this field can
          # only be true when a run demonstrated it, and the record is otherwise never written.
          #
          # `runOnTarget: false` travels inside the evidence: the limits are proven against a
          # native build of the same source, not against the cross-compiled artifact on real
          # hardware. A reviewer should read this as "the policy binds for this code", not "the
          # policy binds on a Seed".

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_COGNITUM_APPS_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to gs://cognitum-apps/cogs/${{ matrix.gcs }}/
        run: |
          set -euo pipefail
          # Main cog binary lands at the catalog root for its arch.
          gcloud storage cp "out/cog-${{ matrix.cog }}-${{ matrix.suffix }}" \
            "gs://cognitum-apps/cogs/${{ matrix.gcs }}/cog-${{ matrix.cog }}-${{ matrix.suffix }}"
          # Any extra assets staged under out/extra/<path> mirror into the
          # cog's versioned prefix (publish-extra.sh decides the layout).
          if [ -d out/extra ]; then
            gcloud storage cp -r out/extra/* \
              "gs://cognitum-apps/cogs/${{ matrix.gcs }}/" || true
          fi
          # DIGEST-ADDRESSED copy. The path above is mutable — the next publish overwrites it,
          # so an immutable releaseDigest cannot reference it (ADR-113 §1). This copy is keyed
          # by the artifact's own digest and is therefore append-only in practice: the same
          # bytes always land at the same path, and different bytes never collide.
          DIGEST="${{ steps.sign.outputs.binary }}"; DIGEST="${DIGEST#sha256:}"
          BASE="gs://cognitum-apps/cogs/by-digest/${DIGEST}"
          gcloud storage cp "out/cog-${{ matrix.cog }}-${{ matrix.suffix }}" "$BASE/artifact"
          # One Sigstore bundle replaces the old .sig/.pem pair — it carries the signature, the
          # Fulcio certificate and the Rekor inclusion proof together, so a verifier needs one
          # object rather than three that can be separated from each other.
          gcloud storage cp "out/cog-${{ matrix.cog }}-${{ matrix.suffix }}.sigstore.json" "$BASE/artifact.sigstore.json"
          gcloud storage cp "out/sbom.cdx.json" "$BASE/sbom.cdx.json"
          gcloud storage cp "out/vuln-scan.json" "$BASE/vuln-scan.json"
          gcloud storage cp "out/provenance.sigstore.json" "$BASE/provenance.sigstore.json"
          gcloud storage cp "out/policy-decision.json" "$BASE/policy-decision.json"
          gcloud storage cp "out/release-evidence.json" "$BASE/release-evidence.json"
          echo "Digest-addressed: $BASE/"
          echo "Uploaded cog-${{ matrix.cog }}-${{ matrix.suffix }} to gs://cognitum-apps/cogs/${{ matrix.gcs }}/"
