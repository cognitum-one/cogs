name: Publish Cog

# Per-cog manual-dispatch publish: cross-compiles ONE cog for every arch its
# cog.toml `hardware_requirement` declares (armhf for pi-zero-2w, aarch64 for
# v0-appliance — see scripts/cog-targets.py), emits the normalized optional
# integration contract, and uploads create-only content-addressed objects.
#
# This repo OWNS cog source + build + publish. The install catalog
# (app-registry.json) lives in cognitum-one/seed — update it by hand from the
# sha256 table in this run's summary (minimal topology, no cross-repo token).
# See docs/adrs/ADR-020-cog-build-publish-pipeline.md and ADR-153.
#
# The cogs-production environment must define GCP_COGS_PROD_WIF_PROVIDER and
# GCP_COGS_PROD_PUBLISH_SA. The dedicated identity needs create-only access to
# gs://cognitum-apps/cogs/releases/, not objectAdmin and never a JSON key.

on:
  workflow_dispatch:
    inputs:
      cog:
        description: 'Cog id (directory under src/cogs/, e.g. tailscale)'
        required: true
      cog_version:
        description: 'Optional assertion; must equal cog.toml [cog].version'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate cog + resolve arches
        id: gen
        env:
          COG_INPUT: ${{ inputs.cog }}
          ASSERTED_VERSION: ${{ inputs.cog_version }}
        run: |
          set -euo pipefail
          COG="$COG_INPUT"
          if [[ ! "$COG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::invalid cog id"
            exit 1
          fi
          if [ ! -f "src/cogs/$COG/cog.toml" ]; then
            echo "::error::no such cog: src/cogs/$COG/cog.toml does not exist"
            exit 1
          fi
          python3 scripts/cog_integrations_cli.py validate "src/cogs/$COG/cog.toml"
          MATRIX=$(python3 scripts/cog-targets.py --matrix "$COG")
          echo "include=$(echo "$MATRIX" | jq -c '.include')" >> "$GITHUB_OUTPUT"
          V=$(python3 -c "import tomllib;print(tomllib.load(open('src/cogs/$COG/cog.toml','rb'))['cog']['version'])")
          ASSERTED="$ASSERTED_VERSION"
          if [ -n "$ASSERTED" ] && [ "$ASSERTED" != "$V" ]; then
            echo "::error::cog_version assertion '$ASSERTED' does not match cog.toml '$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing $COG v$V for: $(echo "$MATRIX" | jq -r '.include[].arch' | tr '\n' ' ')"

  publish:
    name: ${{ matrix.cog }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ubuntu-latest
    environment: cogs-production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Cross-compile cog-${{ matrix.cog }} (${{ matrix.arch }})
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.triple }}
          BIN="target/${{ matrix.triple }}/release/cog-${{ matrix.cog }}"
          ${{ matrix.strip }} "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN" "$GITHUB_WORKSPACE/out/cog-${{ matrix.cog }}-${{ matrix.suffix }}"
          file "$BIN"

      - name: Stage cog-specific extra assets (optional publish-extra.sh)
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
          SUFFIX: ${{ matrix.suffix }}
          GCS: ${{ matrix.gcs }}
          COG_VERSION: ${{ needs.matrix.outputs.version }}
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euo pipefail
          EXTRA="src/cogs/${{ matrix.cog }}/publish-extra.sh"
          if [ -f "$EXTRA" ]; then
            echo "Running $EXTRA for arch=$ARCH"
            bash "$EXTRA"
          else
            echo "no publish-extra.sh for ${{ matrix.cog }} — binary-only cog"
          fi

      - name: Emit content-addressed integration manifest
        run: |
          set -euo pipefail
          python3 scripts/cog_integrations_cli.py emit \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --out-dir out/integrations

      - name: Inspect locked website profile
        id: website
        run: |
          set -euo pipefail
          PROFILE=$(python3 scripts/cog_website_bundle.py inspect \
            "src/cogs/${{ matrix.cog }}/cog.toml")
          echo "enabled=$(echo "$PROFILE" | jq -r '.enabled')" >> "$GITHUB_OUTPUT"
          echo "kind=$(echo "$PROFILE" | jq -r '.kind')" >> "$GITHUB_OUTPUT"

      - name: Require locked website build inputs
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        run: |
          set -euo pipefail
          test -f "src/cogs/${{ matrix.cog }}/package.json"
          test -f "src/cogs/${{ matrix.cog }}/package-lock.json"

      - uses: actions/setup-node@v4
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/cogs/${{ matrix.cog }}/package-lock.json

      - name: Run vite-production-v1
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/vite
          node_modules/.bin/vite build

      - name: Package deterministic website bundle
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        run: |
          set -euo pipefail
          python3 scripts/cog_website_bundle.py package \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --cog-dir "src/cogs/${{ matrix.cog }}" \
            --out-dir out/website

      - name: Compute sha256s
        id: sha
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.cog }} — ${{ matrix.arch }} (v${{ needs.matrix.outputs.version }})"
            echo ""
            echo "| asset | sha256 | bytes |"
            echo "|---|---|---|"
            while IFS= read -r -d '' f; do
              s=$(sha256sum "$f" | awk '{print $1}')
              b=$(stat -c%s "$f")
              echo "| \`${f#out/}\` | \`$s\` | $b |"
            done < <(find out -type f ! -name '*.sha256' -print0 | sort -z)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require production WIF configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_COGS_PROD_WIF_PROVIDER }}
          PUBLISH_SA: ${{ vars.GCP_COGS_PROD_PUBLISH_SA }}
        run: |
          set -euo pipefail
          [ -n "$WIF_PROVIDER" ] || { echo "::error::missing GCP_COGS_PROD_WIF_PROVIDER"; exit 1; }
          [ -n "$PUBLISH_SA" ] || { echo "::error::missing GCP_COGS_PROD_PUBLISH_SA"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_COGS_PROD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_COGS_PROD_PUBLISH_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload immutable release objects
        run: |
          set -euo pipefail
          ROOT="gs://cognitum-apps/cogs/releases/${{ matrix.cog }}/${{ needs.matrix.outputs.version }}/${{ matrix.arch }}"
          upload_immutable() {
            local source="$1"
            local category="$2"
            local digest destination
            digest=$(sha256sum "$source" | awk '{print $1}')
            destination="$ROOT/$category/sha256/$digest/$(basename "$source")"
            gcloud storage cp --if-generation-match=0 "$source" "$destination"
            echo "| \`${source#out/}\` | \`$destination\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo ""
            echo "| immutable object | GCS URI |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          upload_immutable "out/cog-${{ matrix.cog }}-${{ matrix.suffix }}" "binary"
          while IFS= read -r -d '' manifest; do
            upload_immutable "$manifest" "integrations"
          done < <(find out/integrations -type f -print0 | sort -z)
          if [ -d out/website ]; then
            while IFS= read -r -d '' website; do
              upload_immutable "$website" "website"
            done < <(find out/website -type f -print0 | sort -z)
          fi
          if [ -d out/extra ]; then
            while IFS= read -r -d '' asset; do
              upload_immutable "$asset" "assets"
            done < <(find out/extra -type f -print0 | sort -z)
          fi
          echo "Legacy mutable aliases were not written."
