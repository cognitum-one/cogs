name: Build All Cogs

# Umbrella batch build: cross-compiles EVERY cog under src/cogs/ for every arch
# its cog.toml `hardware_requirement` declares (scripts/cog-targets.py) and
# emits each normalized integration sidecar for validation.
#
# Default (workflow_dispatch, publish=false) is a build-only smoke check across
# the whole catalog. The legacy publish=true request fails closed under
# ADR-155. This workflow has no production environment, cloud identity, or
# upload step.

on:
  workflow_dispatch:
    inputs:
      cogs:
        description: 'Space-separated cog subset (blank = all cogs)'
        required: false
        default: ''
      publish:
        description: 'Legacy production request; fails closed under ADR-155'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate matrix from hardware_requirement
        id: gen
        env:
          COGS_INPUT: ${{ inputs.cogs }}
        run: |
          set -euo pipefail
          python3 scripts/cog_integrations_cli.py validate --all
          if [ -n "${COGS_INPUT:-}" ]; then
            read -r -a requested_cogs <<< "$COGS_INPUT"
            MATRIX=$(python3 scripts/cog-targets.py --matrix "${requested_cogs[@]}")
          else
            MATRIX=$(python3 scripts/cog-targets.py --matrix)
          fi
          INCLUDE=$(echo "$MATRIX" | jq -c '.include')
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$INCLUDE" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Build jobs: $(echo "$INCLUDE" | jq 'length')"

  build:
    name: ${{ matrix.cog }} (${{ matrix.arch }})
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/cogs/${{ matrix.cog }}/target
          key: buildall-${{ matrix.cog }}-${{ matrix.arch }}-${{ hashFiles(format('src/cogs/{0}/Cargo.toml', matrix.cog)) }}
          restore-keys: |
            buildall-${{ matrix.cog }}-${{ matrix.arch }}-

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Cross-compile cog-${{ matrix.cog }} (${{ matrix.arch }})
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target ${{ matrix.triple }}
          BIN="target/${{ matrix.triple }}/release/cog-${{ matrix.cog }}"
          ${{ matrix.strip }} "$BIN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN" "$GITHUB_WORKSPACE/out/cog-${{ matrix.cog }}-${{ matrix.suffix }}"
          sha=$(sha256sum "$GITHUB_WORKSPACE/out/cog-${{ matrix.cog }}-${{ matrix.suffix }}" | awk '{print $1}')
          echo "| \`cog-${{ matrix.cog }}-${{ matrix.suffix }}\` | \`$sha\` | $(stat -c%s "$BIN") |" >> "$GITHUB_STEP_SUMMARY"

      - name: Emit content-addressed integration manifest
        id: integrations
        env:
          COG_ID: ${{ matrix.cog }}
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/cog_integrations_cli.py emit \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --out-dir out/integrations)
          export RESULT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          result = json.loads(os.environ["RESULT"])
          root = Path("out/integrations").resolve()
          manifest = Path(result["manifestPath"]).resolve()
          checksum = Path(result["checksumPath"]).resolve()
          expected = {manifest, checksum}
          actual = set(root.iterdir()) if root.is_dir() else set()
          if actual != expected or any(path.is_symlink() or not path.is_file() for path in expected):
              raise SystemExit("integration emitter must resolve exactly one manifest and one checksum")
          measured = hashlib.sha256(manifest.read_bytes()).hexdigest()
          expected_name = f"cog-{os.environ['COG_ID']}-integrations-v1-sha256-{measured}.json"
          if (
              result["digest"] != f"sha256:{measured}"
              or manifest.name != expected_name
              or checksum.name != f"{expected_name}.sha256"
              or checksum.read_text(encoding="utf-8") != f"{measured}  {expected_name}\n"
          ):
              raise SystemExit("integration sidecars do not bind the exact canonical manifest")
          workspace = Path.cwd().resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"manifest={manifest.relative_to(workspace).as_posix()}", file=output)
              print(f"checksum={checksum.relative_to(workspace).as_posix()}", file=output)
              print(f"digest=sha256:{measured}", file=output)
          PY

      - name: Inspect locked website profile
        id: website
        run: |
          set -euo pipefail
          PROFILE=$(python3 scripts/cog_website_bundle.py inspect \
            "src/cogs/${{ matrix.cog }}/cog.toml")
          echo "enabled=$(echo "$PROFILE" | jq -r '.enabled')" >> "$GITHUB_OUTPUT"
          echo "kind=$(echo "$PROFILE" | jq -r '.kind')" >> "$GITHUB_OUTPUT"

      - name: Require locked website build inputs
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        run: |
          set -euo pipefail
          test -f "src/cogs/${{ matrix.cog }}/package.json"
          test -f "src/cogs/${{ matrix.cog }}/package-lock.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/cogs/${{ matrix.cog }}/package-lock.json

      - name: Run vite-production-v1
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        working-directory: src/cogs/${{ matrix.cog }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/vite
          node_modules/.bin/vite build

      - name: Package deterministic website bundle
        id: website_bundle
        if: steps.website.outputs.enabled == 'true' && steps.website.outputs.kind == 'static-build'
        env:
          COG_ID: ${{ matrix.cog }}
        run: |
          set -euo pipefail
          RESULT=$(python3 scripts/cog_website_bundle.py package \
            "src/cogs/${{ matrix.cog }}/cog.toml" \
            --cog-dir "src/cogs/${{ matrix.cog }}" \
            --out-dir out/website)
          export RESULT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          result = json.loads(os.environ["RESULT"])
          root = Path("out/website").resolve()
          bundle = Path(result["bundlePath"]).resolve()
          checksum = Path(result["checksumPath"]).resolve()
          expected = {bundle, checksum}
          actual = set(root.iterdir()) if root.is_dir() else set()
          if actual != expected or any(path.is_symlink() or not path.is_file() for path in expected):
              raise SystemExit("website packager must resolve exactly one bundle and one checksum")
          measured = hashlib.sha256(bundle.read_bytes()).hexdigest()
          expected_name = f"cog-{os.environ['COG_ID']}-website-v1-sha256-{measured}.tar.gz"
          if (
              result["digest"] != f"sha256:{measured}"
              or bundle.name != expected_name
              or checksum.name != f"{expected_name}.sha256"
              or checksum.read_text(encoding="utf-8") != f"{measured}  {expected_name}\n"
          ):
              raise SystemExit("website sidecars do not bind the exact deterministic bundle")
          workspace = Path.cwd().resolve()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"bundle={bundle.relative_to(workspace).as_posix()}", file=output)
              print(f"checksum={checksum.relative_to(workspace).as_posix()}", file=output)
              print(f"digest=sha256:{measured}", file=output)
          PY

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-${{ matrix.cog }}-${{ matrix.version }}-${{ matrix.arch }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Production publication is frozen
    needs: [matrix, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Refuse unsigned batch publication (ADR-155 freeze)
        run: |
          echo "::error::batch production publication is frozen until a separately ratified Ed25519 signing authority is implemented"
          exit 1
