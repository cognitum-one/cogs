[cog]
id = "cloud-inference"
name = "Cloud Inference (Tier-3 metered)"
version = "0.1.1"
category = "ai"
description = "Forwards OpenAI-compat /v1/chat/completions to the metered meta-llm gateway (cognitum-auto). Standalone provider cog per ADR-090 §e — the seed reaches Tier-3 cloud inference through this cog."
binary = "cog-cloud-inference"
hardware_requirement = ["pi-zero-2w", "v0-appliance"]

# Thin HTTP forwarder — no model in RAM. Small envelope.
[resources]
ram_mb = 32
cpu_pct = 20

[config.bind_port]
type = "integer"
label = "HTTP bind port (loopback only — agent proxies)"
description = "Cog binds 127.0.0.1:<this>; agent forwards /api/v1/cogs/cloud-inference/* to here."
default = 8040
min = 8001
max = 9999
cli_arg = "--port"

[config.inference_base_url]
type = "string"
label = "Inference gateway base URL"
description = "The Cognitum completions plane. Default is api.cognitum.one, which routes /v1/* to the meta-llm apicompletions service (mapping live since 2026-07-17; the raw Cloud Run URL was a stopgap before that). For hub-mediated mode, point at the paired v0 hub instead."
default = "https://api.cognitum.one"
cli_arg = "--inference-base-url"

[config.timeout_secs]
type = "integer"
label = "Upstream request timeout"
description = "Max seconds to wait for a cloud completion before returning 504."
default = 60
min = 5
max = 300
unit = "seconds"
cli_arg = "--timeout-secs"

# The gateway bearer is NEVER a cli_arg or a registry field — it is a secret.
# Prefer COG_CLOUD_INFERENCE_KEY_FILE pointing to an absolute agent-owned 0600
# file; the cog re-reads it per request so short-lived OAuth tokens rotate
# without restart. COG_CLOUD_INFERENCE_KEY remains the static legacy fallback.
# Absent/unreadable ⇒ the cog returns 503 and the agent falls back locally.

# ADR-095 §1 — agent proxies /api/v1/cogs/cloud-inference/<endpoint> to the
# loopback bind port with the per-cog bearer token.
#
# `bind_port` MUST be repeated here even though [config.bind_port] already
# carries it: the seed agent copies `api.bind_port` out of the registry entry to
# synthesize the installed cog's cog.toml, and without it `read_cog_bind_port`
# returns None and /api/v1/cogs/cloud-inference/* 404s while the cog sits there
# happily listening. Verified on cognitum-8b40 2026-07-17 — the first publish
# omitted it and Tier-3 dispatch 404'd. Keep in sync with [config.bind_port].
[api]
bind_port = 8040
bind_loopback_only = true
endpoints = [
  { path = "/info",                 methods = ["GET"],  auth = "open" },
  { path = "/health",               methods = ["GET"],  auth = "open" },
  { path = "/v1/chat/completions",  methods = ["POST"], auth = "paired" },
  { path = "/oai_chat",             methods = ["POST"], auth = "paired" },
]

[mcp]
tools = [
  { name = "seed.cog.cloud-inference.info", endpoint = "/info", description = "Cloud inference cog status + endpoint + key presence" },
]

[console]
allowed_commands = ["--help", "--info"]
max_runtime_secs = 15
output_limit_bytes = 32768
